<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>疾病空间聚集观察台</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--ink:#18211d;--muted:#66736c;--paper:#f3f1e9;--panel:#fffdf7;--line:#d9d8cf;--accent:#0c7057;--accent2:#d95d39}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
    header{height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#173c32;color:white}
    header h1{font-size:20px;margin:0;letter-spacing:.04em}header span{font-size:12px;color:#b9d2c9}
    .app{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 72px)}
    aside{padding:22px;border-right:1px solid var(--line);background:var(--panel);overflow:auto}main{min-width:0;display:flex;flex-direction:column}
    h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;margin:0 0 14px;color:var(--muted)}
    label{font-size:12px;color:var(--muted);display:block;margin:12px 0 5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    input,select{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px;background:white;color:var(--ink)}
    button{width:100%;border:0;border-radius:8px;padding:11px;font-weight:650;cursor:pointer;background:var(--accent);color:white;margin-top:14px}
    button.secondary{background:#e8eee9;color:#21473c}button:disabled{opacity:.5;cursor:wait}.rule{height:1px;background:var(--line);margin:22px 0}
    .tabs{height:50px;padding:0 20px;display:flex;gap:22px;align-items:end;background:var(--panel);border-bottom:1px solid var(--line)}
    .tab{width:auto;margin:0;padding:14px 4px 12px;background:none;color:var(--muted);border-radius:0;border-bottom:3px solid transparent}.tab.active{color:var(--accent);border-color:var(--accent)}
    #map{flex:1;min-height:320px}.view{display:none;flex:1;min-height:0}.view.active{display:flex;flex-direction:column}
    #dataView{overflow:auto;padding:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat{padding:10px;background:#eef2ed;border-radius:7px}.stat b{display:block;font-size:19px}.stat small{color:var(--muted)}
    #importView{overflow:auto;padding:28px}.import-card{max-width:680px;background:white;border:1px solid var(--line);border-radius:12px;padding:24px}.import-card h3{margin-top:0}.import-result{margin-top:16px;padding:12px;border-radius:8px;background:#eef2ed;white-space:pre-wrap}.import-result.bad{background:#f8e9e5;color:#8b3b2d}
    table{border-collapse:collapse;width:100%;font-size:13px;background:white}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{position:sticky;top:0;background:#e9ede7}
    .badge{padding:3px 7px;border-radius:999px;color:white;font-size:11px}.proxy{font-weight:700;color:var(--accent2)}
    .disease-list{display:grid;gap:7px;margin:8px 0 4px}.disease-choice{display:flex;align-items:center;gap:8px;margin:0;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);cursor:pointer}.disease-choice input{width:auto;margin:0}.swatch{width:11px;height:11px;border-radius:50%;flex:none}.legend{position:absolute;right:14px;bottom:28px;z-index:500;background:#fffef5eF;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:11px;line-height:1.65;box-shadow:0 3px 14px #0002}.legend i{display:inline-block;width:13px;height:13px;margin-right:5px;vertical-align:-2px}.legend .region{border-radius:3px;opacity:.32}.legend .dot{border-radius:50%}
    .batch-item{padding:8px;border:1px solid var(--line);border-radius:7px;background:white;margin-bottom:7px;font-size:12px}.batch-item label{display:flex;align-items:center;gap:7px;margin:0;color:var(--ink)}.batch-item input{width:auto}.batch-meta{color:var(--muted);margin:4px 0 0 23px}.batch-item button{width:auto;margin:5px 0 0 23px;padding:4px 8px;font-size:11px;background:#f3e8e4;color:#8b3b2d}
    .empty{position:absolute;z-index:500;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:25px;border-radius:12px;box-shadow:0 8px 30px #0002;text-align:center;max-width:360px}.empty h3{margin-top:0}.empty button{width:auto;padding:10px 18px}
    .notice{font-size:12px;line-height:1.5;color:var(--muted);margin-top:10px}.error{color:#a13c2c}.leaflet-div-icon{background:transparent;border:0}
    @media(max-width:760px){.app{display:block;height:auto}aside{border-right:0}.view{height:65vh}.tabs{position:sticky;top:0;z-index:600}}
  </style>
</head>
<body>
<header><h1>疾病空间聚集观察台</h1><span>Persisted PostGIS DBSCAN · 本地分析与浏览</span></header>
<div class="app"><aside>
  <h2>查看已有分析</h2><label for="citySelect">快速定位城市</label><select id="citySelect"><option>正在载入城市…</option></select>
  <label for="runSelect">聚类运行</label><select id="runSelect"></select>
  <div class="stats"><div class="stat"><b id="cases">—</b><small>病例</small></div><div class="stat"><b id="clusters">—</b><small>聚类</small></div><div class="stat"><b id="proxies">—</b><small>代理点</small></div></div>
  <h2>显示疾病</h2><div id="diseaseList" class="disease-list"><span class="notice">选择运行后显示</span></div>
  <div class="rule"></div><h2>数据批次</h2><div id="batchList"><span class="notice">暂无批次</span></div>
  <h2>结果时间筛选</h2><div class="row"><div><label for="filterStart">诊断日期起</label><input id="filterStart" type="date"></div><div><label for="filterEnd">诊断日期止</label><input id="filterEnd" type="date"></div></div>
  <button id="applyFilter" class="secondary">应用筛选</button>
  <div class="rule"></div><h2>运行新分析</h2>
  <label for="analysisEnd">分析截止日期（不包含当天）</label><input id="analysisEnd" type="date" value="2026-09-11">
  <div class="row"><div><label for="days">窗口天数</label><input id="days" type="number" min="1" value="7"></div><div><label for="eps">距离 ε（米）</label><input id="eps" type="number" min="1" value="500"></div></div>
  <div class="row"><div><label for="minPoints">最少点数</label><input id="minPoints" type="number" min="1" value="2"></div><div><label for="srid">目标 SRID</label><input id="srid" type="number" value="32614"></div></div>
  <label><input id="proxyToggle" type="checkbox" checked style="width:auto"> 包含医疗机构代理位置</label>
  <button id="runButton">运行并显示</button><div id="message" class="notice"></div>
</aside><main>
  <nav class="tabs"><button class="tab active" data-view="mapView">聚集地图</button><button class="tab" data-view="dataView">数据</button><button class="tab" data-view="importView">导入数据</button></nav>
  <section id="mapView" class="view active"><div id="map"></div><div class="legend"><div><i class="region" style="background:#536f64"></i>半透明区域：DBSCAN 聚类覆盖</div><div><i class="dot" style="background:#536f64"></i>圆点：病例位置</div><div><b style="font-size:14px;margin-right:5px">▲</b>三角形：医疗机构代理点</div><div>虚线外圈：Noise</div></div><div id="empty" class="empty" hidden><h3>还没有可显示的聚类结果</h3><p>请选择城市并载入中国境内的虚构病例数据。</p><button id="demoButton">载入所选城市示例</button></div></section>
  <section id="dataView" class="view"><table><thead><tr><th>患者标识</th><th>疾病</th><th>诊断日期</th><th>聚类</th><th>位置来源</th><th>代理</th></tr></thead><tbody id="rows"></tbody></table></section>
  <section id="importView" class="view"><div class="import-card"><h3>导入患者病例 CSV</h3><p class="notice">先预览验证，确认无误后才会建立真实数据批次。单个文件最大 10 MB。</p><label for="batchName">批次名称</label><input id="batchName" placeholder="例如：广州市疾控中心 2026-09"><label for="sourceName">数据来源</label><input id="sourceName" placeholder="例如：门诊报告导出"><label for="patientFile">患者 CSV 文件</label><input id="patientFile" type="file" accept=".csv,text/csv"><div class="row"><button id="previewButton" class="secondary">预览并验证</button><button id="confirmImport" disabled>确认导入</button></div><div id="importResult" class="import-result" hidden></div></div></section>
</main></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);let runs=[],cities=[],batches=[],map,layer,currentData=null,selectedDiseases=new Set();
function initMap(){map=L.map('map',{zoomControl:true}).setView([23.1291,113.2644],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);layer=L.featureGroup().addTo(map)}
async function api(url,options){const r=await fetch(url,options);if(!r.ok){let detail='请求失败';try{detail=(await r.json()).detail}catch{}throw new Error(detail)}return r.json()}
function msg(text,error=false){$('message').textContent=text;$('message').className='notice'+(error?' error':'')}
async function loadRuns(selectNewest=true){runs=await api('/api/runs');const select=$('runSelect');select.innerHTML=runs.map(r=>`<option value="${r.run_id}">#${r.run_id} · ${r.window_start.slice(0,10)} → ${r.window_end.slice(0,10)} · ${r.status}</option>`).join('');$('empty').hidden=runs.some(r=>r.status==='COMPLETED');if(selectNewest&&runs.length)select.value=runs.find(r=>r.status==='COMPLETED')?.run_id||runs[0].run_id;if(select.value)await loadResults()}
async function loadCities(){cities=await api('/api/cities');$('citySelect').innerHTML=cities.map(c=>`<option value="${c.id}" ${c.id==='guangzhou'?'selected':''}>${c.name}</option>`).join('');applyCity()}
function applyCity(){const city=cities.find(c=>c.id===$('citySelect').value);if(!city)return;map.flyTo([city.latitude,city.longitude],city.zoom,{duration:.65});$('srid').value=city.target_srid;msg(`已定位到${city.name}，新分析将使用 SRID ${city.target_srid}。`)}
async function loadBatches(){batches=await api('/api/batches');$('batchList').innerHTML=batches.length?batches.map(b=>`<div class="batch-item"><label><input class="batch-check" type="checkbox" value="${b.batch_id}" ${b.is_included?'checked':''}><b>${b.batch_name}</b></label><div class="batch-meta">${b.patient_count} 条 · ${b.is_synthetic?'合成数据':'真实数据'} · ${b.is_included?'已纳入':'已排除'}</div><button data-delete="${b.batch_id}">删除批次</button></div>`).join(''):'<span class="notice">暂无批次</span>';$('batchList').querySelectorAll('.batch-check').forEach(x=>x.onchange=async()=>{await api(`/api/batches/${x.value}?included=${x.checked}`,{method:'PATCH'});await loadBatches()});$('batchList').querySelectorAll('[data-delete]').forEach(x=>x.onclick=async()=>{if(!confirm('确认删除这个批次？已被分析引用的批次会受到保护。'))return;try{await api('/api/batches/'+x.dataset.delete,{method:'DELETE'});await loadBatches()}catch(e){msg(e.message,true)}})}
async function loadResults(){const id=$('runSelect').value;if(!id)return;const qs=new URLSearchParams({run_id:id});if($('filterStart').value)qs.set('start',$('filterStart').value);if($('filterEnd').value)qs.set('end',$('filterEnd').value);try{currentData=await api('/api/results?'+qs);selectedDiseases=new Set(currentData.diseases.map(d=>d.name));renderDiseaseChoices();render()}catch(e){msg(e.message,true)}}
function renderDiseaseChoices(){$('diseaseList').innerHTML=currentData.diseases.map(d=>`<label class="disease-choice"><input type="checkbox" value="${d.name}" checked><span class="swatch" style="background:${d.color}"></span>${d.name}</label>`).join('');$('diseaseList').querySelectorAll('input').forEach(input=>input.onchange=()=>{input.checked?selectedDiseases.add(input.value):selectedDiseases.delete(input.value);render()})}
function render(){const {run}=currentData;const points=currentData.points.filter(p=>selectedDiseases.has(p.illness));const areas=currentData.areas.filter(a=>selectedDiseases.has(a.illness));$('cases').textContent=points.length;$('clusters').textContent=areas.length;$('proxies').textContent=points.filter(p=>p.is_proxy).length;layer.clearLayers();const bounds=[];for(const a of areas){L.geoJSON(a.geometry,{style:{stroke:false,fillColor:a.color,fillOpacity:.26},onEachFeature:(_,l)=>l.bindTooltip(`${a.illness} · Cluster ${a.cluster_id} · ${a.case_count} cases`)}).addTo(layer)}for(const p of points){const html=`<b>${p.patient_id}</b><br>${p.illness} · ${p.diagnosis_date}<br>${p.cluster_label}<br>${p.location_source}${p.is_proxy?' · 代理点':''}`;let marker;if(p.is_proxy){const noise=p.cluster_id===null?'filter:drop-shadow(0 0 1px #333);':'';marker=L.marker([p.latitude,p.longitude],{icon:L.divIcon({className:'',html:`<div style="color:${p.color};font-size:25px;text-shadow:0 0 2px white;${noise}">▲</div>`,iconSize:[22,22]})})}else{marker=L.circleMarker([p.latitude,p.longitude],{radius:6,color:p.cluster_id===null?'#555':p.color,fillColor:p.color,fillOpacity:.92,weight:p.cluster_id===null?2:1.5,dashArray:p.cluster_id===null?'3 3':null})}marker.bindPopup(html).bindTooltip(`${p.patient_id} · ${p.cluster_label}`).addTo(layer);bounds.push([p.latitude,p.longitude])}if(bounds.length)map.fitBounds(bounds,{padding:[35,35],maxZoom:15});$('rows').innerHTML=points.map(p=>`<tr><td>${p.patient_id}</td><td><span class="swatch" style="display:inline-block;background:${p.color}"></span> ${p.illness}</td><td>${p.diagnosis_date}</td><td><span class="badge" style="background:${p.cluster_id===null?'#555':p.color}">${p.cluster_label}</span></td><td>${p.location_source}</td><td class="${p.is_proxy?'proxy':''}">${p.is_proxy?'是':'否'}</td></tr>`).join('');$('empty').hidden=points.length>0||runs.length>0;msg(`正在查看运行 #${run.run_id}：${selectedDiseases.size} 种疾病，显示 ${points.length} 个点、${areas.length} 个聚类区域。`)}
async function busy(button,fn){button.disabled=true;try{await fn()}catch(e){msg(e.message,true)}finally{button.disabled=false}}
let previewValid=false;function importForm(includeMetadata=false){const file=$('patientFile').files[0];if(!file)throw new Error('请先选择 CSV 文件');const form=new FormData();form.append('file',file);if(includeMetadata){if(!$('batchName').value.trim())throw new Error('请填写批次名称');form.append('batch_name',$('batchName').value.trim());form.append('source_name',$('sourceName').value.trim())}return form}
$('previewButton').onclick=()=>busy($('previewButton'),async()=>{const result=await api('/api/import/preview',{method:'POST',body:importForm()});previewValid=result.error_count===0;$('confirmImport').disabled=!previewValid;$('importResult').hidden=false;$('importResult').className='import-result'+(previewValid?'':' bad');$('importResult').textContent=previewValid?`验证通过：${result.valid_count} 条有效病例，可以确认导入。`:`发现 ${result.error_count} 个错误，${result.valid_count} 条有效记录。\n`+result.errors.slice(0,12).map(e=>`第 ${e.row??'-'} 行 · ${e.field??'文件'} · ${e.message}`).join('\n')});
$('patientFile').onchange=()=>{previewValid=false;$('confirmImport').disabled=true;$('importResult').hidden=true};
$('confirmImport').onclick=()=>busy($('confirmImport'),async()=>{if(!previewValid)throw new Error('请重新预览验证文件');const result=await api('/api/import/patients',{method:'POST',body:importForm(true)});$('importResult').textContent=`导入完成：批次「${result.batch_name}」，${result.record_count} 条病例。`;previewValid=false;$('confirmImport').disabled=true;await loadBatches()});
$('citySelect').onchange=applyCity;$('runSelect').onchange=loadResults;$('applyFilter').onclick=loadResults;
$('runButton').onclick=()=>busy($('runButton'),async()=>{msg('正在运行空间聚类…');const batch_ids=[...document.querySelectorAll('.batch-check:checked')].map(x=>+x.value);const body={analysis_end:$('analysisEnd').value,window_days:+$('days').value,eps_meters:+$('eps').value,min_points:+$('minPoints').value,target_srid:+$('srid').value,include_proxy_locations:$('proxyToggle').checked,batch_ids};await api('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('filterStart').value='';$('filterEnd').value='';await loadRuns(true)});
$('demoButton').onclick=()=>busy($('demoButton'),async()=>{const city=cities.find(c=>c.id===$('citySelect').value);msg(`正在载入${city.name}虚构示例并聚类…`);await api('/api/demo?city='+city.id,{method:'POST'});await loadBatches();await loadRuns(true)});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===t.dataset.view));if(t.dataset.view==='mapView')setTimeout(()=>map.invalidateSize(),10)});
initMap();Promise.all([loadCities(),loadBatches(),loadRuns()]).catch(e=>msg('无法连接数据库：'+e.message,true));
</script></body></html>
